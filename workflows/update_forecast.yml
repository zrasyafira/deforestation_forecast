name: Auto Update Forecast Dataset

on:
  schedule:
    - cron: "0 0 1 * *"  # Jalankan tiap tanggal 1 pukul 00:00 UTC
  workflow_dispatch:     # Bisa dijalankan manual
  push:
    branches: [ main ]

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install xgboost pandas numpy

      - name: Run forecast script
        run: python forecast_update.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/deforestation_historical_forecast_full.csv
          git commit -m "Auto update forecast dataset"
          git push
